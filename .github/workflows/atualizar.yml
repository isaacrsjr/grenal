name: Atualizar resultados

on:
  schedule:
    # Todo dia às 06:17 UTC (03:17 em Brasília), depois dos jogos da noite
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Buscar resultados e recalcular
        run: node scripts/update.js
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza resultados e probabilidades"
            git push
          fi
