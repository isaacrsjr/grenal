name: Atualizar resultados

on:
  schedule:
    # Horários em UTC (Brasília = UTC-3, sem horário de verão)
    # Antes dos jogos: 09:47 em Brasília. O jogo mais cedo da temporada começou às 11h (domingo).
    - cron: '47 12 * * *'
    # Depois dos jogos: 00:43 em Brasília. O jogo mais tarde começa às 21h30 e termina por volta de 23h30.
    - cron: '43 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Buscar resultados e recalcular
        run: node scripts/update.js
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza resultados e probabilidades"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            # O GitHub pausa o agendamento após 60 dias sem commits (ex.: entressafra)
            git commit --allow-empty -m "Mantém a atualização automática ativa"
            git push
          else
            echo "Nada mudou."
          fi
